name: Packages

# Publishes a released version to package managers: a Homebrew tap, a Scoop
# bucket, winget and the AUR. The Release workflow calls this after it
# publishes; it also runs when a release is published by hand, and can be run
# from the Actions tab for any released tag.
#
# Each package manager is skipped until its secret exists:
#   PACKAGES_TOKEN        token that can push to Iruora/homebrew-agentscope and
#                         Iruora/scoop-agentscope (create both repos first)
#   WINGET_TOKEN          classic token with public_repo, used to open the
#                         pull request on microsoft/winget-pkgs from a fork
#   AUR_SSH_PRIVATE_KEY   private key added to your AUR account
# Manifests are generated by scripts/packages/manifests.mjs.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish, e.g. v1.2.0
        required: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  TAP_REPO: Iruora/homebrew-agentscope
  BUCKET_REPO: Iruora/scoop-agentscope

jobs:
  manifests:
    name: Write the manifests
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/packages/manifests.test.mjs
      - name: Hash the release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*.msi' --pattern '*_portable.zip' --pattern '*.deb'
          (cd dist && sha256sum *) | tee SHA256SUMS
      - run: node scripts/packages/manifests.mjs --version "$TAG" --sums SHA256SUMS --out manifests
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: manifests
          include-hidden-files: true

  homebrew:
    name: Homebrew tap
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - name: Push the cask
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::No PACKAGES_TOKEN secret, skipping Homebrew"; exit 0; fi
          git clone "https://x-access-token:$TOKEN@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks && cp homebrew/Casks/agentscope.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/agentscope.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "agentscope ${TAG#v}"
          git push

  scoop:
    name: Scoop bucket
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - name: Push the manifest
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::No PACKAGES_TOKEN secret, skipping Scoop"; exit 0; fi
          git clone "https://x-access-token:$TOKEN@github.com/$BUCKET_REPO.git" bucket
          mkdir -p bucket/bucket && cp scoop/bucket/agentscope.json bucket/bucket/
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/agentscope.json
          git diff --cached --quiet && { echo "Manifest already up to date"; exit 0; }
          git commit -m "agentscope ${TAG#v}"
          git push

  winget:
    name: winget
    needs: manifests
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - name: Open the winget-pkgs pull request
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:TOKEN) { Write-Output "::notice::No WINGET_TOKEN secret, skipping winget"; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:TOKEN --prtitle "New version: Iruora.AgentScope $($env:TAG.TrimStart('v'))" winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  aur:
    name: AUR
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - name: Push agentscope-bin
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::No AUR_SSH_PRIVATE_KEY secret, skipping the AUR"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          # The AUR creates the package on its first push.
          git clone ssh://aur@aur.archlinux.org/agentscope-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "Iruora"
          git config user.email "22733738+Iruora@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "AUR package already up to date"; exit 0; }
          git commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
