name: Release

# Pushing a tag like v1.0.0 builds the installers for every platform and
# attaches them to a draft GitHub release. Review the draft, then publish it.
# Running it by hand from the Actions tab with a tag that does not exist yet
# creates that tag on the commit it runs from (usually main) first.
#
# Builds are unsigned. To sign later, add the secrets Tauri reads (APPLE_*
# for macOS, a Windows certificate or signCommand) and pass them in `env`
# below; nothing else changes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.0.0 (created on the selected branch if missing)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create the draft release
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create the tag if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the app version $version in tauri.conf.json"
            exit 1
          fi
      - name: Create or reuse the draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag --title "AgentScope $TAG" --notes-file .github/release-notes.md
            id=$(find_id)
          else
            # A rerun refreshes the notes of the existing draft.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@.github/release-notes.md --silent
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          zip="AgentScope_${version}_${{ matrix.arch }}.app.zip"
          # ditto keeps the bundle's signature and symlinks intact.
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/AgentScope.app" "$zip"
          # A rerun replaces the zip from the previous attempt.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$zip\") | .id")
          if [ -n "$old" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          gh api --method POST -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$zip" \
            --input "$zip" --silent
      - name: Zip the portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $out = "target/${{ matrix.target }}/release"
          $dir = New-Item -ItemType Directory -Force -Path "portable/AgentScope"
          # The app looks for agentscope-hook.exe next to itself.
          Copy-Item "$out/agentscope-desktop.exe" "$dir/AgentScope.exe"
          Copy-Item "$out/agentscope-hook.exe" "$dir/agentscope-hook.exe"
          $zip = "AgentScope_${version}_${{ matrix.arch }}_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          # A rerun replaces the zip from the previous attempt.
          $jq = '.[] | select(.name == "' + $zip + '") | .id'
          $old = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" --jq $jq
          if ($old) { gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$old" }
          gh api --method POST -H "Content-Type: application/zip" `
            "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$zip" `
            --input $zip --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
