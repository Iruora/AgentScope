[package]
name = "agentscope-desktop"
description = "AgentScope desktop app"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "agentscope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentscope-adapters.workspace = true
agentscope-core.workspace = true
agentscope-protocol.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
